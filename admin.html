<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約一覧 — ピラティススタジオ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding-top: 4rem; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .admin-table th, .admin-table td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid var(--color-border); }
    .admin-table th { background: var(--color-bg-alt); font-weight: 600; }
    .admin-table tr:hover td { background: rgba(0,0,0,0.02); }
    .admin-empty { color: var(--color-text-muted); padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">ピラティススタジオ</a>
      <nav class="nav">
        <a href="index.html">トップ</a>
        <a href="booking.html">予約ページ</a>
      </nav>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <h1 class="section-title">予約一覧</h1>
      <div id="list"></div>
    </div>
  </main>
  <script>
    fetch('/api/bookings')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var el = document.getElementById('list');
        if (!data.length) {
          el.innerHTML = '<p class="admin-empty">まだ予約はありません。</p>';
          return;
        }
        var classNames = { mat: 'マット', reformer: 'リフォーマー', cadillac: 'キャデラック', private: 'プライベート' };
        var html = '<table class="admin-table"><thead><tr><th>日付</th><th>時間</th><th>クラス</th><th>お名前</th><th>電話</th><th>メール</th><th>備考</th></tr></thead><tbody>';
        data.forEach(function(b) {
          html += '<tr><td>' + b.date + '</td><td>' + b.time + '</td><td>' + (classNames[b.classType] || b.classType) + '</td><td>' + b.name + '</td><td>' + b.phone + '</td><td>' + b.email + '</td><td>' + (b.memo || '') + '</td></tr>';
        });
        html += '</tbody></table>';
        el.innerHTML = html;
      })
      .catch(function() {
        document.getElementById('list').innerHTML = '<p class="admin-empty">予約データの取得に失敗しました。サーバーを起動していますか？</p>';
      });
  </script>
</body>
</html>
